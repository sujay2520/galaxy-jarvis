[project]
name = "galaxy"
version = "0.1.0"
description = "Galaxy (Jarvis) — Permission-based multi-agent autonomous system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "playwright>=1.40.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0",
]

[project.scripts]
galaxy = "galaxy.cli.main:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["galaxy*"]
