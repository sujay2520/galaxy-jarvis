services:
  - type: web
    name: galaxy-jarvis
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python run.py
    envVars:
      - key: PREFERRED_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20"
