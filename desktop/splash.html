<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Starting Galaxy...</title>
    <style>
        body {
            background-color: #0a0a18;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-user-select: none;
            -webkit-app-region: drag;
        }
        h1 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            position: relative;
            animation: spin 2s linear infinite;
        }
        .spinner-dot {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }
        .spinner-dot::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4a90e2;
            animation: dot 2s ease-in-out infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes dot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.5); background-color: #a55eea; }
        }
    </style>
</head>
<body>
    <h1>GALAXY</h1>
    <div class="spinner">
        <div class="spinner-dot"></div>
    </div>
    <div style="margin-top: 15px; font-size: 12px; color: #888;">Starting core services...</div>
</body>
</html>
